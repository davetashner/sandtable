<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" width="320" height="186">
  <defs>
    <marker id="cannae-head" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke" />
    </marker>
  </defs>

  <!-- Rome: one heavy column, pushing straight ahead -->
  <g fill="var(--french)">
    <rect x="46" y="66" width="74" height="54" rx="2" opacity="0.9" />
  </g>
  <g stroke="var(--french)" stroke-width="2" fill="none" marker-end="url(#cannae-head)">
    <path d="M124,80 L152,80" />
    <path d="M124,93 L152,93" />
    <path d="M124,106 L152,106" />
  </g>
  <text x="83" y="97" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace"
    font-size="10" font-weight="600" fill="var(--panel)">ROME</text>

  <!-- Carthage: the centre bows back rather than breaks -->
  <path d="M168,60 C186,74 186,112 168,126" fill="none" stroke="var(--army-1)"
    stroke-width="3.5" stroke-linecap="round" />

  <!-- and both wings close behind -->
  <g fill="none" stroke="var(--army-1)" stroke-width="3" stroke-linecap="round"
    marker-end="url(#cannae-head)">
    <path d="M176,50 C150,26 96,24 58,44 C40,53 34,62 32,72" />
    <path d="M176,136 C150,160 96,162 58,142 C40,133 34,124 32,114" />
  </g>
  <text x="196" y="97" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10"
    font-weight="600" fill="var(--army-1)">CARTHAGE</text>

  <text x="160" y="180" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace"
    font-size="9" letter-spacing="0.08em" fill="var(--muted)">THE CENTRE GIVES; THE WINGS CLOSE</text>
</svg>
