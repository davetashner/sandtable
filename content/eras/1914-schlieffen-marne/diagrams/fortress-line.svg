<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <defs>
    <marker id="fort-head" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="context-stroke" />
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="320" height="210" fill="var(--sea)" />
  <path d="M0,44 C60,34 128,30 190,36 L320,36 L320,210 L0,210 Z" fill="var(--land)"
    stroke="var(--brass-dim)" stroke-width="1.2" />

  <!-- the 1871 frontier: Alsace-Lorraine is German now -->
  <path d="M214,36 L210,96 L216,150 L232,192" fill="none" stroke="var(--brass-dim)"
    stroke-width="1.1" stroke-dasharray="3 3" />

  <g font-family="IBM Plex Mono, ui-monospace, monospace" fill="var(--muted)"
    letter-spacing="0.12em">
    <text x="104" y="52" font-size="9">BELGIUM</text>
    <text x="86" y="176" font-size="10">FRANCE</text>
    <text x="252" y="70" font-size="9">GERMANY</text>
  </g>

  <!-- Séré de Rivières: the fortified frontier, Verdun down to Belfort -->
  <g fill="var(--brass)">
    <circle cx="196" cy="98" r="4" />
    <circle cx="192" cy="122" r="4" />
    <circle cx="198" cy="150" r="4" />
    <circle cx="212" cy="178" r="4" />
  </g>
  <path d="M196,98 L192,122 L198,150 L212,178" fill="none" stroke="var(--brass)" stroke-width="1.6"
    stroke-dasharray="1 4" stroke-linecap="round" />
  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="8.5" fill="var(--brass)">
    <text x="150" y="96">Verdun</text>
    <text x="158" y="120">Toul</text>
    <text x="148" y="148">Épinal</text>
    <text x="156" y="182">Belfort</text>
  </g>

  <!-- the direct road, closed -->
  <path d="M286,130 L232,130" fill="none" stroke="var(--muted)" stroke-width="2.5"
    stroke-linecap="round" opacity="0.65" />
  <g stroke="var(--accent-red)" stroke-width="2.5" stroke-linecap="round">
    <path d="M226,122 L240,138" />
    <path d="M240,122 L226,138" />
  </g>

  <!-- the way round -->
  <path d="M262,52 C214,46 152,50 108,66 C76,78 62,98 64,120" fill="none" stroke="var(--army-1)"
    stroke-width="3.5" stroke-linecap="round" marker-end="url(#fort-head)" />

  <text x="160" y="204" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace"
    font-size="9" letter-spacing="0.08em" fill="var(--muted)">THE DOOR IS SHUT; THE WINDOW IS BELGIUM</text>
</svg>
