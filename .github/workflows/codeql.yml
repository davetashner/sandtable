name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `analyze` is a required check, so it would have to run for merge-queue
  # entries too. No queue is enabled and none can be here; the trigger is kept
  # for the same reason ci.yml keeps its own (see there).
  merge_group:
  schedule:
    - cron: '27 6 * * 1' # weekly, Monday 06:27 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              - infra/functions

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
