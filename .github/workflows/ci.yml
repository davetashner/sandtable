name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint (workflow files)
        run: |
          docker run --rm -v "$PWD":/repo --workdir /repo rhysd/actionlint:latest -color

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" "#.claude" "#poc"

      - name: content checks (JSON + media manifests)
        run: bash scripts/check-content.sh

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # dependency-review comments on PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans history

      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # image-size (JXL/HEIF/ICNS parser DoS; no patched release as of
          # 2026-08-22) is reached only via @deck.gl/geo-layers → @luma.gl/gltf →
          # @loaders.gl/textures → texture-compressor, a Node-only encoder CLI
          # that is never imported by the browser bundle (verified: not in dist/).
          # Revisit when upstream publishes a fix (npm audit will show it).
          allow-ghsas: GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq

  web:
    # Activates automatically once the app scaffold (package.json) lands.
    # Until then every step is skipped and the job reports success, so it can
    # be a required check from day one.
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: detect app
        id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet — web checks skipped."; fi

      - uses: actions/setup-node@v7
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: install
        if: steps.app.outputs.present == 'true'
        run: npm ci

      # One step, because there is one definition of green (ADR 0023). The
      # gate list used to live here as eight named steps, in
      # docs/agent-workflow.md as prose, and in contributors' habits — three
      # copies free to drift, and they did. `verify` in package.json is now
      # the list; this job runs it, the doc points at it, and a contributor
      # runs the same command CI does. Each gate still names itself in the log:
      # npm prints `> sandtable@0.1.0 typecheck` before running one.
      #
      # Order is fail-fast and load-bearing at one point: `bundle:budget` reads
      # dist/ and must follow `build` (ADR 0016, sand-pmz.31). `visual:check`
      # is not in it — it needs a browser and a cache, and it has a job of its
      # own for that reason (ADR 0011).
      - name: verify
        if: steps.app.outputs.present == 'true'
        run: npm run verify --if-present

  visual:
    # The visual gate (ADR 0011): twenty-four scenes × two themes × desktop
    # and phone, every cell off one load per scene, walked against a
    # production-shaped build with the assets bucket stubbed inside the
    # browser, asserting that every scene renders, that
    # nothing shouts on the console, and that no structural layout defect
    # appears outside scripts/visual-baseline.json. It does not diff pixels —
    # the screenshots are an artifact for a human, not a comparison.
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: install chromium
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: chromium system libraries (browser restored from cache)
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: build
        run: npm run build

      - name: visual check
        run: npm run visual:check -- --shots visual-check --report visual-check/report.json

      - name: screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-check
          path: visual-check/
          retention-days: 14
